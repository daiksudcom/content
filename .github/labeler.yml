# Version-impact labels come only from the pull request head branch. Paths may
# classify operational areas, but can never manufacture a SemVer bump.
'BREAKING CHANGE':
  - head-branch: ['^breaking-change/(?:feat|perf|fix)/']

DEPRECATED:
  - head-branch: ['^deprecated/(?:feat|perf|fix)/']

feat:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?feat/']

perf:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?perf/']

fix:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?fix/']

revert:
  - head-branch: ['^(?:revert|rollback)/']

release:
  - head-branch: ["^(?:release|rollback)/v[0-9]+\\.[0-9]+\\.[0-9]+/"]

content:
  - any:
      - head-branch: ['^content/']
      - changed-files:
          - any-glob-to-all-files: 'blog/**'

docs:
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-all-files: '{docs/**,README.md,**/*.md}'

refactor:
  - head-branch: ['^refactor/']

style:
  - head-branch: ['^style/']

test:
  - any:
      - head-branch: ['^test/']
      - changed-files:
          - any-glob-to-all-files: '{test,tests}/**'

build:
  - any:
      - head-branch: ['^build/']
      - changed-files:
          - any-glob-to-all-files: '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.nvmrc,tsconfig.json,*config.*,.*rc*,.husky/**,.vscode/**}'

ci:
  - any:
      - head-branch: ['^ci/']
      - changed-files:
          - any-glob-to-all-files: '{.github/workflows/**,.github/dependabot.yml,.github/labeler.yml,.github/release.yml,.github/settings.yml,.github/scripts/**}'

chore:
  - head-branch: ['^(?:chore|release)/']
