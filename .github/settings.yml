apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: content
  owner: daiksudme

# Preserve GitHub defaults, Dependabot labels, and unrelated rulesets.
reconcile:
  labels: additive
  rulesets: additive

spec:
  description: Specifications for content.daiksud.me and its OpenAPI contract
  topics: [adr, api, astro, cloudflare-workers, gherkin, mdx, specification]
  visibility: public
  archived: false

  labels:
    - name: BREAKING CHANGE
      description: Backward-incompatible public contract change (MAJOR; MINOR under 0.y.z)
      color: b60205
    - name: DEPRECATED
      description: Public contract marked for future removal (MINOR)
      color: fbca04
    - name: feat
      description: A new public feature (MINOR)
      color: 0e8a16
    - name: perf
      description: A public performance improvement (MINOR)
      color: 7fd18a
    - name: fix
      description: A bug fix (PATCH)
      color: 0052cc
    - name: revert
      description: A reverted public change (PATCH)
      color: 79b8ff
    - name: content
      description: Article or article-media-only update (build metadata)
      color: 1d76db
    - name: docs
      description: Documentation-only change
      color: c4b5e0
    - name: refactor
      description: Code change without a public behavior change
      color: 8ec9cc
    - name: style
      description: Change that does not affect code meaning
      color: b5dcde
    - name: test
      description: Test addition or correction
      color: d8ecec
    - name: build
      description: Build system or dependency change
      color: a8aeb4
    - name: ci
      description: CI configuration or automation change
      color: cfd3d7
    - name: chore
      description: Other maintenance change
      color: ededed

  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true

  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE

  release_immutability: true

  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true

  rulesets:
    - name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: [~DEFAULT_BRANCH]
      rules:
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
            - context: CI success
              app: github-actions
            - context: Policy success
              app: github-actions
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: true
        required_signatures: true
    - name: release-tags
      target: tag
      enforcement: active
      bypass_actors:
        - app: github-actions
          bypass_mode: always
      conditions:
        ref_name:
          include: ['refs/tags/v*']
      rules:
        non_fast_forward: true
        deletion: true
        creation: true
        required_linear_history: false
        required_signatures: false

  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    fork_pr_approval: first_time_contributors
